<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} - Lantai Samudera Purba{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  
  <!-- Script CDN Tailwind CSS -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex flex-col min-h-screen">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-white">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight text-emerald-400 flex items-center gap-2">
        <span class="text-2xl">🌋</span> Geowisata Karangsambung
      </a>
      <nav class="hidden md:flex gap-6 text-sm font-medium text-slate-300">
        <a href="/geosite" class="hover:text-emerald-400 transition">Geosite</a>
        <a href="/geo-heritage" class="hover:text-emerald-400 transition">Katalog Batuan</a>
        <a href="/geo-trail" class="hover:text-emerald-400 transition">Rute Wisata</a>
        <a href="/paket-wisata" class="hover:text-emerald-400 transition">Paket Tour</a>
        <a href="/artikel" class="hover:text-emerald-400 transition">Artikel</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow">
    {{ block "main" . }}{{ end }}
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-6 text-center text-sm">
      <p>&copy; {{ now.Format "2006" }} Geowisata Karangsambung. Cagar Alam Geologi Kebumen.</p>
    </div>
  </footer>

</body>
</html>
