{{ define "main" }}
<section class="max-w-screen-2xl mx-auto px-6 py-14">
  <div class="border-b border-slate-200 pb-8 mb-12">
    <h1 class="font-serif text-3xl md:text-4xl font-bold text-slate-900 mt-1">{{ .Title }}</h1>
    {{ if .Description }}
    <p class="text-slate-600 text-sm md:text-base mt-2 max-w-2xl leading-relaxed">
      {{ .Description }}
    </p>
    {{ end }}
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    {{ range .Pages }}
    <article class="rounded-2xl overflow-hidden bg-white border border-slate-200 flex flex-col justify-between group">
      <div class="p-5 space-y-2">
        <h2 class="font-serif text-lg font-bold text-slate-900 group-hover:text-emerald-900 transition-colors leading-snug">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        <p class="text-slate-600 text-xs leading-relaxed line-clamp-3 pt-1">
          {{ .Summary }}
        </p>
      </div>
      <div class="p-5 pt-0">
        <a href="{{ .RelPermalink }}" class="inline-block text-xs font-bold text-emerald-900 hover:underline uppercase tracking-wider">
          Selengkapnya &rarr;
        </a>
      </div>
    </article>
    {{ else }}
    <div class="col-span-3 py-16 text-center border border-dashed border-slate-200 bg-slate-50/50">
      <p class="text-slate-500 text-xs font-medium">Belum ada konten yang diterbitkan.</p>
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
