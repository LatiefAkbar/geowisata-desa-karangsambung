{{ define "main" }}
<article class="max-w-screen-2xl mx-auto px-6 py-12">
  <nav class="text-xs font-semibold text-slate-400 mb-8 flex items-center gap-2">
    <a href="/" class="hover:text-slate-900 transition">Beranda</a>
    <span>/</span>
    <span class="text-slate-600 line-clamp-1">{{ .Title }}</span>
  </nav>

  <header class="mb-10 space-y-3 border-b border-slate-200 pb-8">
    <h1 class="font-serif text-3xl sm:text-4xl md:text-5xl font-bold text-slate-900 leading-tight">
      {{ .Title }}
    </h1>
    {{ if .Description }}
    <p class="text-slate-600 text-base md:text-lg leading-relaxed font-light pt-1">
      {{ .Description }}
    </p>
    {{ end }}
  </header>

  <div class="prose prose-slate md:prose-lg max-w-none
              prose-headings:font-serif prose-headings:font-bold prose-headings:text-slate-900
              prose-p:text-slate-700 prose-p:leading-relaxed
              prose-a:text-emerald-900 prose-a:font-semibold hover:prose-a:underline
              prose-blockquote:border-l-2 prose-blockquote:border-emerald-800 prose-blockquote:font-serif prose-blockquote:italic prose-blockquote:text-slate-600
              prose-img:border prose-img:border-slate-200">
    {{ .Content }}
  </div>
</article>
{{ end }}
